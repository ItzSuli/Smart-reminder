name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "downloads/**"
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: keep your own signing key in a secret instead of the repo.
      # Store the .jks as base64 in KEYSTORE_BASE64 and set KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      - name: Use keystore from secrets (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/ci.jks
            echo "KEYSTORE_FILE=keystore/ci.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SmartReminder-apk
          path: app/build/outputs/apk/release/app-release.apk
