name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: keep your own signing key in a secret instead of the repo.
      # Store the .jks as base64 in KEYSTORE_BASE64 and set KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      - name: Use keystore from secrets (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/ci.jks
            echo "KEYSTORE_FILE=keystore/ci.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk SmartReminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartReminder-apk
          path: SmartReminder.apk

      # Pushing a tag like v1.2.0 (or running this workflow by hand with a release_tag)
      # publishes a GitHub Release with the APK attached.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        run: |
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          awk -v tag="$tag" '/^## /{p = ($2 == tag)} p && !/^## /' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Smart Reminder $tag" > release-notes.md; fi
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Smart Reminder ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: SmartReminder.apk
